name: branch-flow

# Enforces two long-lived branches and one release path: feature -> develop -> main.
#
# WHY THIS EXISTS
#   Ported from the ShipTrack Pro plugin repository, where these checks were
#   written after main drifted for real. A develop -> main PR was merged as a
#   *squash*, producing a commit on main whose content duplicated several develop
#   commits but shared no identity with them. main then sat ahead of develop, and
#   both following develop -> main PRs hit the same conflicts and were abandoned.
#
#   Setting the same guards up here before the first merge is far cheaper than
#   untangling it afterwards, which is the whole reason this file exists on day
#   one rather than after the first incident.
#
# THE TWO RULES, AND WHY EACH NEEDS ITS OWN JOB
#   1. Only `main` and `develop` are long-lived. `base-branch` enforces that by
#      refusing any PR aimed at a third branch — a long-lived branch is created
#      by someone merging into it, so refusing the merge is what prevents it.
#   2. Everything reaches main through develop. `source-branch` enforces that.
#
#   Neither implies the other: rule 1 without rule 2 permits a feature branch
#   straight into main, and rule 2 without rule 1 permits `release/x` to quietly
#   become a third trunk that nothing checks.
#
# Runs on `edited` as well, so retargeting a PR re-checks it — a plain retarget
# does NOT re-trigger ci.yml, which defaults to [opened, synchronize, reopened].

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    # Deliberately unfiltered. A `branches:` filter here would list the bases to
    # check, and the whole point of `base-branch` is to catch a base that is not
    # on the list — a filtered trigger simply would not fire for it.

# Permissions are declared per job, not here: only main-not-ahead checks out the
# repository. The others read the event payload and need no token scope at all,
# and granting them one workflow-wide would be handing out access nothing uses.

concurrency:
  group: branch-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base-branch:
    name: PR targets main or develop
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "$BASE_REF" == "main" || "$BASE_REF" == "develop" ]]; then
            echo "base '$BASE_REF' is one of the two long-lived branches."
            exit 0
          fi
          echo "::error title=Third long-lived branch::This PR targets '$BASE_REF'. Only 'main' and 'develop' are long-lived here; merging into anything else starts a third trunk that no other check in this workflow protects. Retarget to develop."
          exit 1

  source-branch:
    name: PR into main comes from develop
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main'
    permissions: {}
    steps:
      - name: Check the head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == "develop" ]]; then
            echo "head '$HEAD_REF' may target main."
            exit 0
          fi
          # There is deliberately no hotfix escape hatch. An urgent fix still
          # goes through develop: it is one extra merge, it takes a minute, and
          # it keeps `main` a branch whose contents are always a superset of
          # develop's. The escape hatch is what turns "two branches" into
          # "two branches plus whatever shipped at 3am", and main-not-ahead
          # would then block the next ordinary release until someone
          # back-merged by hand.
          echo "::error title=Wrong base branch::'$HEAD_REF' cannot target main. Everything reaches main through develop — retarget this PR to develop, then open develop -> main."
          exit 1

  no-squash-reminder:
    name: develop into main must be a merge commit
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    permissions: {}
    steps:
      # Advisory only — GitHub decides the merge method at merge time, so a check
      # cannot block it. The real enforcement is the protect-main ruleset
      # restricting allowed merge methods to "merge". This makes the reason
      # visible on the PR itself, where whoever clicks the button will see it.
      - name: Explain
        run: |
          echo "::notice title=Merge this with a merge commit::Squashing develop into main creates a commit develop can never contain, and every later develop -> main PR then conflicts on it. The protect-main ruleset restricts merge methods to 'merge' only."

  main-not-ahead:
    name: main is not ahead of develop
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Catches drift that has already happened, rather than waiting for the next
      # develop -> main PR to conflict and get abandoned.
      - name: Compare main and develop
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main develop:refs/remotes/origin/develop --quiet

          ahead="$(git rev-list --count origin/develop..origin/main)"
          if [[ "$ahead" -eq 0 ]]; then
            echo "main has no commits develop is missing."
            exit 0
          fi

          echo "main is $ahead commit(s) ahead of develop:"
          git log --oneline origin/develop..origin/main
          echo "::error title=main is ahead of develop::main carries $ahead commit(s) develop does not have, so this PR will conflict and future merges compute from a stale base. Back-merge main into develop first."
          exit 1
