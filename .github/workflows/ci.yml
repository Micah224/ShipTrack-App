name: ci

# Quality gates only. Deployment is NOT here on purpose.
#
# The Vercel GitHub App is installed on this repository and builds every push,
# so a deploy from Actions would race it: two builds of the same commit
# publishing to the same project, with the winner decided by whichever finishes
# last. So Vercel owns CD, Actions owns CI, and neither duplicates the other.
#
# Deliberately NOT triggered on push to main: a merge into main carries a tree
# that already passed as a PR, and Vercel rebuilds it anyway. Skipping that
# saves a full duplicate run per merge, which matters on a private repo where
# Actions minutes are metered.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitattributes'
      - '.editorconfig'
      - '.vscode/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the code is CORRECT. Split from `build` on purpose: build proves the
  # tree COMPILES AND PACKAGES, this proves the source is sound, and a failure in
  # one should not be reported as the other. Both are required.
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          # setup-node defaults to check-latest: false, which resolves '24'
          # against whatever 24.x the runner image happens to have cached.
          # Pin to the real latest instead.
          check-latest: true
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Flat config (eslint.config.mjs), typescript-eslint plus
      # eslint-plugin-svelte.
      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # Vitest. --passWithNoTests is kept in the script so a package with no
      # suites is not a failure, but this now gates real tests.
      - name: Unit tests
        run: npm run test

  # Proves the tree actually builds. Runs with no environment file, which CI
  # does not have — so this also catches any build-time dependency on a secret,
  # which would otherwise only surface in Vercel's build and be harder to
  # attribute. Nothing here should need one: secrets are read at request time
  # through src/lib/server/env.ts, never at build time.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: npm

      - run: npm ci --no-audit --no-fund

      # `vite build` runs @sveltejs/adapter-vercel, which emits the deployable
      # .vercel/output/ artifact as part of the same command. There is no
      # separate bundling step to run, unlike the OpenNext setup this replaced.
      - name: Build
        run: npm run build
