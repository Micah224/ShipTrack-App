name: ci

# Quality gates only. Deployment is NOT here on purpose.
#
# The `cloudflare-workers-and-pages` GitHub App is installed on this repository,
# so Cloudflare Workers Builds already builds and deploys on push. A second
# deploy from Actions would race it: two builds of the same commit publishing to
# the same Worker, with the winner decided by whichever finishes last. So
# Cloudflare owns CD, Actions owns CI, and neither duplicates the other.
#
# Deliberately NOT triggered on push to main: a merge into main carries a tree
# that already passed as a PR, and Cloudflare rebuilds it anyway. Skipping that
# saves a full duplicate run per merge, which matters on a private repo where
# Actions minutes are metered.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitattributes'
      - '.editorconfig'
      - '.vscode/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Proves the code is CORRECT. Split from `build` on purpose: build proves the
  # tree COMPILES AND PACKAGES, this proves the source is sound, and a failure in
  # one should not be reported as the other. Both are required.
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          # setup-node defaults to check-latest: false, which resolves '24'
          # against whatever 24.x the runner image happens to have cached.
          # Pin to the real latest instead.
          check-latest: true
          cache: npm

      - run: npm ci --no-audit --no-fund

      # eslint-config-next 16 ships native flat configs; `next lint` was removed
      # in Next 16 and silently treats "lint" as a directory argument, which is
      # how this script came to be broken before CI existed to catch it.
      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # --passWithNoTests until Project A lands the first suites. This is an
      # honest green rather than a job that does not exist: the runner is wired,
      # so adding a test file is all that is needed for it to start gating.
      - name: Unit tests
        run: npm run test

  # Proves the tree actually builds. Runs WITHOUT .env.local, which CI does not
  # have — so this also catches any build-time dependency on a secret, which
  # would otherwise only surface in Cloudflare's build and be harder to attribute.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          check-latest: true
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: next build
        run: npm run build

      # Build the actual deployable artifact, not just the Next output.
      # `next build` produces .next/; Cloudflare deploys .open-next/worker.js,
      # and only opennextjs-cloudflare produces that. Without this step CI can be
      # green while the deploy fails on a missing entry point — which is exactly
      # what happened on the first Cloudflare build of this repo.
      #
      # Note the scripts must stay separate: opennextjs-cloudflare invokes
      # `npm run build` internally to build the Next app, so pointing `build` at
      # it instead of `next build` recurses infinitely.
      - name: worker bundle
        run: npm run build:worker
